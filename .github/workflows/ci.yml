name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Demo recording replays without Kane
        run: |
          node bin/hydra.js demo --port 4400 &
          for i in $(seq 1 20); do curl -sf localhost:4400/api/runs > /tmp/runs.json && break; sleep 1; done
          node -e 'const j=require("/tmp/runs.json"); if(!j.runs.length) process.exit(1); console.log(j.runs.length, "recorded runs")'
